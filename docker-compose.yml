services:
  bombarie:
    image: ghcr.io/popupcity/bombarie:latest
    build: .
    restart: unless-stopped
    ports:
      - '4321:4321'
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/data
      - ./config:/config
